<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete Coach - Athletes</title>

    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background: #050505;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

        }


        .page {

            max-width: 1100px;

            margin: 0 auto;

            padding: 40px 20px;

        }


        /* ================================
           HEADER
        ================================= */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 45px;

        }


        .logo {

            font-size: 28px;

            font-weight: 900;

            letter-spacing: 2px;

            color: #C6FF00;

        }


        .coach-label {

            font-size: 12px;

            letter-spacing: 2px;

            color: #888;

            margin-top: 4px;

        }


        h1 {

            font-size: 32px;

            margin: 0 0 8px 0;

        }


        .subtitle {

            color: #888;

            font-size: 14px;

        }


        /* ================================
           ATHLETES
        ================================= */

        .athletes-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .athletes-header h2 {

            margin: 0;

            font-size: 21px;

        }


        .athlete-count {

            color: #C6FF00;

            font-size: 14px;

        }


        .athletes-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap: 15px;

        }


        /* ================================
           ATHLETE CARD
        ================================= */

        .athlete-card {

            background: #101010;

            border: 1px solid #252525;

            border-radius: 14px;

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 15px;

            cursor: pointer;

            transition:
                border-color .2s,
                transform .2s,
                background .2s;

        }


        .athlete-card:hover {

            border-color: #C6FF00;

            background: #151515;

            transform: translateY(-2px);

        }


        .avatar {

            width: 64px;

            height: 64px;

            min-width: 64px;

            border-radius: 50%;

            object-fit: cover;

            background: #222;

        }


        .avatar-placeholder {

            display: flex;

            align-items: center;

            justify-content: center;

            color: #C6FF00;

            font-size: 18px;

            font-weight: 800;

        }


        .athlete-info {

            min-width: 0;

            flex: 1;

        }


        .athlete-name {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .athlete-email {

            font-size: 12px;

            color: #777;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .athlete-details {

            margin-top: 5px;

            font-size: 11px;

            color: #999;

        }


        .arrow {

            color: #C6FF00;

            font-size: 25px;

        }


        /* ================================
           STATES
        ================================= */

        .loading {

            color: #888;

            padding: 30px 0;

        }


        .empty {

            border: 1px dashed #333;

            border-radius: 12px;

            padding: 30px;

            text-align: center;

            color: #777;

        }


        .error {

            color: #ff6666;

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .page {

                padding: 25px 15px;

            }


            header {

                margin-bottom: 35px;

            }


            h1 {

                font-size: 27px;

            }


            .athletes-grid {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header>

        <div>

            <div class="logo">
                TWETE
            </div>

            <div class="coach-label">
                COACH
            </div>

        </div>

    </header>



    <main>


        <h1>
            Athletes
        </h1>

        <div class="subtitle">
            Select an athlete to manage their training.
        </div>


        <br>


        <div class="athletes-header">

            <h2>
                Registered athletes
            </h2>

            <div
                class="athlete-count"
                id="athleteCount"
            >
                0 athletes
            </div>

        </div>


        <div
            class="athletes-grid"
            id="athletesGrid"
        >

            <div class="loading">
                Loading athletes...
            </div>

        </div>


    </main>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- OUR JAVASCRIPT -->

<script src="coach.js"></script>


</body>

</html>
