<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete Coach - Athletes</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }


        body {

            background: #050505;

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            padding-bottom: 90px;

        }


        /* ================================
           PAGE
        ================================= */

        .page {

            max-width: 1100px;

            margin: 0 auto;

            padding: 40px 20px;

        }


        /* ================================
           HEADER
        ================================= */

        header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 45px;

        }


        .logo {

            font-size: 28px;

            font-weight: 900;

            letter-spacing: 2px;

            color: #C6FF00;

        }


        .coach-label {

            font-size: 12px;

            letter-spacing: 2px;

            color: #888;

            margin-top: 4px;

        }


        h1 {

            font-size: 32px;

            margin: 0 0 8px 0;

        }


        .subtitle {

            color: #888;

            font-size: 14px;

        }

.push-settings {

    margin: 25px 0 30px 0;

    padding: 18px;

    background: #101010;

    border: 1px solid #252525;

    border-radius: 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.push-title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 5px;
}

.push-description {

    font-size: 12px;

    color: #777;
}

.push-toggle {

    min-width: 65px;

    padding: 9px 14px;

    border: 1px solid #333;

    border-radius: 20px;

    background: #181818;

    color: #777;

    font-weight: 700;

    cursor: pointer;
}

.push-toggle.on {

    background: #C6FF00;

    color: #050505;

    border-color: #C6FF00;
}
        /* ================================
           ATHLETES
        ================================= */

        .athletes-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;

        }


        .athletes-header h2 {

            margin: 0;

            font-size: 21px;

        }


        .athlete-count {

            color: #C6FF00;

            font-size: 14px;

        }


        .athletes-grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fill,
                    minmax(280px, 1fr)
                );

            gap: 15px;

        }


        /* ================================
           ATHLETE CARD
        ================================= */

        .athlete-card {

            background: #101010;

            border: 1px solid #252525;

            border-radius: 14px;

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 15px;

            cursor: pointer;

            transition:
                border-color .2s,
                transform .2s,
                background .2s;

        }


        .athlete-card:hover {

            border-color: #C6FF00;

            background: #151515;

            transform: translateY(-2px);

        }


        .avatar {

            width: 64px;

            height: 64px;

            min-width: 64px;

            border-radius: 50%;

            object-fit: cover;

            background: #222;

        }


        .avatar-placeholder {

            display: flex;

            align-items: center;

            justify-content: center;

            color: #C6FF00;

            font-size: 18px;

            font-weight: 800;

        }


        .athlete-info {

            min-width: 0;

            flex: 1;

        }


        .athlete-name {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 6px;

        }


        .athlete-email {

            font-size: 12px;

            color: #777;

            overflow: hidden;

            text-overflow: ellipsis;

            white-space: nowrap;

        }


        .athlete-details {

            margin-top: 5px;

            font-size: 11px;

            color: #999;

        }


        .arrow {

            color: #C6FF00;

            font-size: 25px;

        }


        /* ================================
           STATES
        ================================= */

        .loading {

            color: #888;

            padding: 30px 0;

        }


        .empty {

            border: 1px dashed #333;

            border-radius: 12px;

            padding: 30px;

            text-align: center;

            color: #777;

        }


        .error {

            color: #ff6666;

        }


        /* ================================
           COACH FOOTER
        ================================= */

        .bottom-navigation {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            height: 70px;

            z-index: 1000;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 55px;

            background:
                rgba(
                    8,
                    8,
                    8,
                    .97
                );

            border-top: 1px solid #222;

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

        }


        .nav-item {

            min-width: 80px;

            border: none;

            background: transparent;

            color: #777;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

            cursor: pointer;

            padding: 0;

        }


        .nav-item.active {

            color: #C6FF00;

        }


        .nav-item svg {

            width: 24px;

            height: 24px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .nav-item span {

            font-size: 10px;

            font-weight: 600;

        }


        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 600px) {

            .page {

                padding: 25px 15px;

            }


            header {

                margin-bottom: 35px;

            }


            h1 {

                font-size: 27px;

            }


            .athletes-grid {

                grid-template-columns: 1fr;

            }


            .bottom-navigation {

                gap: 45px;

            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header>

        <div>

            <div class="logo">
                TWETE
            </div>

            <div class="coach-label">
                COACH
            </div>

        </div>

    </header>



    <main>


        <h1>
            Athletes
        </h1>


        <div class="subtitle">

            Select an athlete to manage their training.

        </div>
<div class="push-settings">

    <div>
        <div class="push-title">
            Push Notifications
        </div>

        <div class="push-description">
            Get notified when an athlete sends you a message.
        </div>
    </div>

    <button
        id="coachPushToggle"
        class="push-toggle"
        onclick="toggleCoachPush()"
    >
        OFF
    </button>

</div>

        <br>


        <div class="athletes-header">

            <h2>
                Registered athletes
            </h2>


            <div
                class="athlete-count"
                id="athleteCount"
            >
                0 athletes
            </div>

        </div>


        <div
            class="athletes-grid"
            id="athletesGrid"
        >

            <div class="loading">

                Loading athletes...

            </div>

        </div>


    </main>


</div>



<!-- ================================
     COACH FOOTER
================================= -->

<nav class="bottom-navigation">


    <!-- HOME -->

    <button
        class="nav-item active"
        onclick="goCoachHome()"
    >

        <svg viewBox="0 0 24 24">

            <path
                d="M3 10.5L12 3l9 7.5"
            ></path>

            <path
                d="M5 9.5V21h14V9.5"
            ></path>

            <path
                d="M9 21v-6h6v6"
            ></path>

        </svg>


        <span>
            Home
        </span>

    </button>



    <!-- MESSAGES -->

    <button
        class="nav-item"
        onclick="goCoachMessages()"
    >

        <svg viewBox="0 0 24 24">

            <path
                d="M4 4h16v12H8l-4 4V4z"
            ></path>

            <line
                x1="8"
                y1="9"
                x2="16"
                y2="9"
            ></line>

            <line
                x1="8"
                y1="12"
                x2="14"
                y2="12"
            ></line>

        </svg>


        <span>
            Messages
        </span>

    </button>


</nav>



<!-- ================================
     SUPABASE
================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- EXISTING COACH JS -->

<script src="coach.js"></script>

<script>
    const profileSupabase = coachSupabase;
</script>

<script src="push-notifications.js"></script>


<script>

    function goCoachHome() {

        window.location.href =
            "coach.html";

    }


    function goCoachMessages() {

        window.location.href =
            "messages.html";

    }
async function updateCoachPushButton() {

    const button =
        document.getElementById(
            "coachPushToggle"
        );

    if (!button) return;

    const enabled =
        await isPushEnabled();

    if (enabled) {

        button.textContent = "ON";

        button.classList.add("on");

    } else {

        button.textContent = "OFF";

        button.classList.remove("on");

    }
}


async function toggleCoachPush() {

    const button =
        document.getElementById(
            "coachPushToggle"
        );

    if (!button) return;


    const enabled =
        await isPushEnabled();


    if (enabled) {

        await disablePushNotifications();

    } else {

        await enablePushNotifications();

    }


    await updateCoachPushButton();
}


document.addEventListener(
    "DOMContentLoaded",
    function() {

        updateCoachPushButton();

    }
);
</script>


</body>

</html>
