<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Twete Messages</title>
<link rel="stylesheet" href="messages.css">
</head>

<body>

<div class="chat">

    <!-- HEADER -->

    <header class="chat-header">

        <button
            class="back-button"
            type="button"
            aria-label="Back"
        >
            <svg viewBox="0 0 24 24">
                <path d="M15 18l-6-6 6-6"></path>
            </svg>
        </button>

        <div class="header-avatar">
            D
        </div>

        <div class="header-info">
            <h1>David</h1>
        </div>

    </header>


    <!-- MESSAGE WINDOW -->

    <main
        class="messages-window"
        id="messagesWindow"
    >

        <!-- Temporary dummy messages -->

        <div class="message-row received">

            <div class="message-bubble">

                <div class="message-text">
                    Hello David
                </div>

                <div class="message-time">
                    12:30
                </div>

            </div>

        </div>


        <div class="message-row sent">

            <div class="message-bubble">

                <div class="message-text">
                    Hi! How are you?
                </div>

                <div class="message-meta">

                    <span>
                        12:31
                    </span>

                    <span class="message-checks">
                        ✓✓
                    </span>

                </div>

            </div>

        </div>


        <div class="message-row received">

            <div class="message-bubble">

                <div class="message-text">
                    I'm doing great. How is your training going?
                </div>

                <div class="message-time">
                    12:32
                </div>

            </div>

        </div>


        <div class="message-row sent">

            <div class="message-bubble">

                <div class="message-text">
                    Training went really well today.
                </div>

                <div class="message-meta">

                    <span>
                        12:33
                    </span>

                    <span class="message-checks">
                        ✓✓
                    </span>

                </div>

            </div>

        </div>


        <div class="message-row received">

            <div class="message-bubble">

                <div class="message-text">
                    That's great to hear!
                </div>

                <div class="message-time">
                    12:34
                </div>

            </div>

        </div>

    </main>


    <!-- COMPOSER -->

    <footer class="chat-composer">

    <!-- ATTACHMENT PREVIEW -->

    <div
        class="attachment-preview"
        id="attachmentPreview"
        hidden
    >

        <div
            class="attachment-preview-content"
            id="attachmentPreviewContent"
        ></div>

        <button
            class="attachment-remove"
            id="attachmentRemove"
            type="button"
            aria-label="Remove attachment"
        >
            ×
        </button>

    </div>


    <!-- CAMERA BUTTON -->

<button
    class="attachment-button camera-button"
    id="cameraButton"
    type="button"
    aria-label="Take photo"
>

    <svg viewBox="0 0 24 24">

        <path
            d="M4 7h3l2-2h6l2 2h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"
        ></path>

        <circle
            cx="12"
            cy="13"
            r="3.5"
        ></circle>

    </svg>

</button>


<!-- ATTACHMENT BUTTON -->

<button
    class="attachment-button"
    type="button"
    id="attachmentButton"
    aria-label="Attach file"
>

    <svg viewBox="0 0 24 24">

        <path
            d="M21.4 11.6l-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"
        ></path>

    </svg>

</button>


    <!-- TEXT -->

    <textarea
        id="messageInput"
        placeholder="Write a message..."
        rows="1"
    ></textarea>


    <!-- SEND -->

    <button
        class="send-button"
        type="button"
        aria-label="Send message"
    >

        <svg viewBox="0 0 24 24">

            <path d="M22 2L11 13"></path>

            <path
                d="M22 2l-7 20-4-9-9-4 20-7z"
            ></path>

        </svg>

    </button>


    <!-- FILE INPUT -->
<!-- CAMERA INPUT -->


    <input
        type="file"
        id="attachmentInput"
        hidden
        multiple
        accept="image/*,video/*,.pdf,.doc,.docx,.txt"
    >

</footer>
<!-- =========================================
     TWETE CAMERA
========================================= -->

<div
    class="camera-overlay"
    id="cameraOverlay"
    hidden
>

    <div class="camera-container">

        <!-- CAMERA HEADER -->

        <div class="camera-header">

            <button
                class="camera-close"
                id="cameraClose"
                type="button"
                aria-label="Close camera"
            >
                ×
            </button>

            <span>
                Camera
            </span>

        </div>


        <!-- CAMERA VIEW -->

        <div class="camera-view">

            <video
                id="cameraVideo"
                autoplay
                playsinline
                muted
            ></video>

            <canvas
                id="cameraCanvas"
                hidden
            ></canvas>

        </div>


        <!-- CAMERA CONTROLS -->

        <div class="camera-controls">

            <button
                class="camera-capture"
                id="cameraCapture"
                type="button"
                aria-label="Take photo"
            >
                <span></span>
            </button>

        </div>

    </div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="messages.js"></script>

    
</body>
</html>
