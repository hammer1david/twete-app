<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Twete | Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>


<body>

<div class="messages-app">


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="chat-header">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Go back"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M15 18l-6-6 6-6"
                ></path>

            </svg>

        </button>


        <div
            id="profileAvatar"
            class="profile-avatar"
        >
            T
        </div>


        <div class="profile-info">

            <div
                id="profileName"
                class="profile-name"
            >
                Loading...
            </div>


            <div
                id="profileRole"
                class="profile-role"
            >
                Coach
            </div>

        </div>

    </header>



    <!-- =====================================
         CHAT BOX
    ====================================== -->

    <main
        id="messagesList"
        class="chat-box"
        aria-live="polite"
    >

        <div class="messages-loading">
            Loading messages...
        </div>

    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="chat-footer">

        <textarea
            id="messageInput"
            rows="1"
            maxlength="5000"
            placeholder="Write a message..."
            aria-label="Message"
        ></textarea>


        <button
            id="sendButton"
            type="button"
            aria-label="Send message"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path
                    d="M22 2L11 13"
                ></path>

                <path
                    d="M22 2L15 22L11 13L2 9L22 2Z"
                ></path>

            </svg>

        </button>

    </footer>


</div>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="messages.js"></script>


</body>

</html>
