<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>


<body>

<div class="messages-app">


    <!-- HEADER -->




    <!-- COACH ATHLETE LIST -->

    <section
        id="athleteListSection"
        class="athlete-list-section hidden"
    >

        <div class="section-title">
            Your Athletes
        </div>


        <div
            id="athleteList"
            class="athlete-list"
        >

            <div class="messages-loading">
                Loading athletes...
            </div>

        </div>

    </section>



    <!-- ACTIVE CONVERSATION -->

    <section
        id="conversationSection"
        class="conversation-section hidden"
    >


        <div class="conversation-header">

            <button
                id="conversationBack"
                class="conversation-back"
                onclick="showAthleteList()"
                aria-label="Back to athletes"
            >

                <svg viewBox="0 0 24 24">
                    <path d="M15 18l-6-6 6-6"></path>
                </svg>

            </button>


            <div
                class="profile-avatar"
                id="profileAvatar"
            >
                T
            </div>


            <div class="profile-info">

                <h2 id="profileName">
                    Loading...
                </h2>

                <span id="profileRole">
                    Coach
                </span>

            </div>

        </div>



        <!-- MESSAGES -->

        <main
            class="messages-list"
            id="messagesList"
        >

            <div class="messages-loading">
                Loading messages...
            </div>

        </main>



        <!-- COMPOSER -->

        <div class="message-composer">


            <!-- ATTACHMENT INPUT -->

            <input
                type="file"
                id="attachmentInput"
                class="attachment-input"
                accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"
            >


            <!-- ATTACHMENT BUTTON -->

            <button
                type="button"
                id="attachmentButton"
                class="attachment-button"
                onclick="document.getElementById('attachmentInput').click()"
                aria-label="Attach file"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                    ></path>

                </svg>

            </button>


            <textarea
                id="messageInput"
                placeholder="Write a message..."
                rows="1"
            ></textarea>


            <button
                id="sendButton"
                onclick="sendMessage()"
                aria-label="Send message"
            >

                <svg viewBox="0 0 24 24">

                    <path
                        d="M22 2L11 13"
                    ></path>

                    <path
                        d="M22 2L15 22L11 13L2 9L22 2Z"
                    ></path>

                </svg>

            </button>

        </div>


    </section>



    <!-- FOOTER -->

    <nav class="bottom-navigation">


        <button
            class="nav-item"
            onclick="goHome()"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M3 10.5L12 3l9 7.5"
                ></path>

                <path
                    d="M5 9.5V21h14V9.5"
                ></path>

                <path
                    d="M9 21v-6h6v6"
                ></path>

            </svg>


            <span>
                Home
            </span>

        </button>



        <button
            class="nav-item active"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M4 4h16v12H8l-4 4V4z"
                ></path>

                <line
                    x1="8"
                    y1="9"
                    x2="16"
                    y2="9"
                ></line>

                <line
                    x1="8"
                    y1="12"
                    x2="14"
                    y2="12"
                ></line>

            </svg>


            <span>
                Messages
            </span>

        </button>


    </nav>


</div>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="messages.js"></script>
<script src="message-attachments.js"></script>


</body>

</html>
