<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Twete | Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>


<body>

<div class="chat-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="chat-header">

        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Go back"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <path d="M15 18L9 12L15 6"></path>

            </svg>

        </button>


        <div
            id="chatAvatar"
            class="chat-avatar"
            aria-hidden="true"
        >

            <span id="chatAvatarLetter">
                T
            </span>

        </div>


        <div class="chat-user-info">

            <div
                id="chatUserName"
                class="chat-user-name"
            >
                Loading...
            </div>

            <div
                id="chatUserStatus"
                class="chat-user-status"
            >
                Loading...
            </div>

        </div>

    </header>



    <!-- =========================================
         CHAT
    ========================================== -->

    <main
        id="chatMessages"
        class="chat-messages"
        aria-live="polite"
        aria-relevant="additions"
    >

        <!-- Messages will be inserted here -->

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->
<footer class="chat-footer">

    <!-- Attachment preview -->
    <div
        id="attachmentPreview"
        class="attachment-preview"
        hidden
    ></div>


    <div class="message-composer">

        <!-- Attachment button -->
        <button
            id="attachmentButton"
            class="attachment-button"
            type="button"
            aria-label="Add attachment"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M12 5V19"></path>
                <path d="M5 12H19"></path>
            </svg>
        </button>


        <!-- Hidden file picker -->
        <input
            id="attachmentInput"
            type="file"
            hidden
            multiple
            accept="image/*,video/*,.pdf,.doc,.docx,.txt"
        >


        <textarea
            id="messageInput"
            class="message-input"
            placeholder="Write a message..."
            rows="1"
            maxlength="5000"
            autocomplete="off"
            aria-label="Message"
        ></textarea>


        <button
            id="sendButton"
            class="send-button"
            type="button"
            aria-label="Send message"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22L11 13L2 9L22 2"></path>
            </svg>
        </button>

    </div>

</footer>
    


</div>
<!-- ======================================
     CHAT LOADING OVERLAY
======================================= -->

<div
    id="chatLoadingOverlay"
    class="chat-loading-overlay"
>
    <div class="chat-loading-dots">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<!-- =========================================
     SUPABASE
========================================== -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================
     CHAT JAVASCRIPT
========================================== -->

<script src="messages.js"></script>


</body>

</html>
