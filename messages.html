<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>


<body>

<div class="messages-app">


    <!-- HEADER -->

    <header class="messages-header">

        <button
            class="back-button"
            onclick="goBack()"
            aria-label="Back"
        >

            <svg viewBox="0 0 24 24">

                <path d="M15 18l-6-6 6-6"></path>

            </svg>

        </button>


        <h1>
            Messages
        </h1>


        <div class="header-spacer"></div>

    </header>



    <!-- COACH / ATHLETE HEADER -->

    <section class="conversation-header">

        <div
            class="profile-avatar"
            id="profileAvatar"
        >
            C
        </div>


        <div class="profile-info">

            <h2 id="profileName">
                Loading...
            </h2>

            <span id="profileRole">
                Coach
            </span>

        </div>

    </section>



    <!-- MESSAGE AREA -->

    <main
        class="messages-list"
        id="messagesList"
    >

        <div class="messages-loading">
            Loading messages...
        </div>

    </main>



    <!-- MESSAGE COMPOSER -->

    <div class="message-composer">

        <textarea
            id="messageInput"
            placeholder="Write a message..."
            rows="1"
        ></textarea>


        <button
            id="sendButton"
            onclick="sendMessage()"
            aria-label="Send message"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M22 2L11 13"
                ></path>

                <path
                    d="M22 2L15 22L11 13L2 9L22 2Z"
                ></path>

            </svg>

        </button>

    </div>



    <!-- FOOTER -->

    <nav class="bottom-navigation">


        <button
            class="nav-item"
            onclick="goHome()"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M3 10.5L12 3l9 7.5"
                ></path>

                <path
                    d="M5 9.5V21h14V9.5"
                ></path>

                <path
                    d="M9 21v-6h6v6"
                ></path>

            </svg>


            <span>
                Home
            </span>

        </button>



        <button
            class="nav-item active"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M4 4h16v12H8l-4 4V4z"
                ></path>

                <line
                    x1="8"
                    y1="9"
                    x2="16"
                    y2="9"
                ></line>

                <line
                    x1="8"
                    y1="12"
                    x2="14"
                    y2="12"
                ></line>

            </svg>


            <span>
                Messages
            </span>

        </button>


    </nav>


</div>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script src="messages.js"></script>


</body>

</html>
