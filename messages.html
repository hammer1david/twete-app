<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >
</head>

<body>

    <div class="chat">

        <!-- =================================
             HEADER
        ================================== -->

        <header class="chat-header">

            <button
                class="back-button"
                type="button"
            >
                ←
            </button>

            <div class="header-avatar">
                D
            </div>

            <div class="header-info">

                <h1>
                    David
                </h1>

                <span>
                    Messages
                </span>

            </div>

        </header>


        <!-- =================================
             MESSAGE WINDOW
             ONLY THIS AREA SCROLLS
        ================================== -->

        <main
            class="messages-window"
            id="messagesWindow"
        >

            <!--
                DUMMY MESSAGES

                These are only for testing
                the layout.

                We will replace them with
                real Supabase messages later.
            -->

            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        Hello David
                    </div>

                    <div class="message-time">
                        12:30
                    </div>

                </div>

            </div>


            <div class="message-row sent">

                <div class="message-bubble">

                    <div class="message-text">
                        Hi! How are you?
                    </div>

                    <div class="message-time">
                        12:31
                    </div>

                </div>

            </div>


            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        I'm doing great. How is your training going?
                    </div>

                    <div class="message-time">
                        12:32
                    </div>

                </div>

            </div>


            <div class="message-row sent">

                <div class="message-bubble">

                    <div class="message-text">
                        Training went really well today.
                    </div>

                    <div class="message-time">
                        12:33
                    </div>

                </div>

            </div>


            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        That's great to hear!
                    </div>

                    <div class="message-time">
                        12:34
                    </div>

                </div>

            </div>

        </main>


        <!-- =================================
             COMPOSER / FOOTER
             FIXED OWN AREA
        ================================== -->

        <footer class="chat-composer">

            <button
                class="attachment-button"
                type="button"
            >
                +
            </button>

            <textarea
                id="messageInput"
                placeholder="Write a message..."
                rows="1"
            ></textarea>

            <button
                class="send-button"
                type="button"
            >
                ↑
            </button>

        </footer>

    </div>

</body>
</html>
