<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete Messages</title>

    <link
        rel="stylesheet"
        href="messages.css"
    >

</head>


<body>

    <div class="chat">


        <!-- =================================
             HEADER
        ================================== -->

        <header class="chat-header">

            <button
                class="back-button"
                type="button"
                aria-label="Back"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>


            <div class="header-avatar">
                D
            </div>


            <div class="header-info">

                <h1>
                    David
                </h1>

            </div>

        </header>



        <!-- =================================
             MESSAGE WINDOW
             ONLY THIS AREA SCROLLS
        ================================== -->

        <main
            class="messages-window"
            id="messagesWindow"
        >

            <!-- DUMMY MESSAGES -->

            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        Hello David
                    </div>

                    <div class="message-time">
                        12:30
                    </div>

                </div>

            </div>


            <div class="message-row sent">

                <div class="message-bubble">

                    <div class="message-text">
                        Hi! How are you?
                    </div>

                    <div class="message-time">
                        12:31
                    </div>

                </div>

            </div>


            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        I'm doing great. How is your training going?
                    </div>

                    <div class="message-time">
                        12:32
                    </div>

                </div>

            </div>


            <div class="message-row sent">

                <div class="message-bubble">

                    <div class="message-text">
                        Training went really well today.
                    </div>

                    <div class="message-time">
                        12:33
                    </div>

                </div>

            </div>


            <div class="message-row received">

                <div class="message-bubble">

                    <div class="message-text">
                        That's great to hear!
                    </div>

                    <div class="message-time">
                        12:34
                    </div>

                </div>

            </div>

        </main>



        <!-- =================================
             COMPOSER / FOOTER
        ================================== -->

        <footer class="chat-composer">


            <!-- ATTACHMENT -->

            <button
                class="attachment-button"
                type="button"
                aria-label="Attach file"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        d="M21.4 11.6l-8.8 8.8a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5"
                    />

                </svg>

            </button>


            <!-- TEXT FIELD -->

            <textarea
                id="messageInput"
                placeholder="Write a message..."
                rows="1"
            ></textarea>


            <!-- SEND -->

            <button
                class="send-button"
                type="button"
                aria-label="Send message"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M22 2L11 13"/>

                    <path
                        d="M22 2l-7 20-4-9-9-4 20-7z"
                    />

                </svg>

            </button>


        </footer>


    </div>

</body>

</html>
