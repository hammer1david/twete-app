<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Athlete</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="app">

        <div class="glow-line top"></div>
        <div class="glow-line bottom"></div>


        <main class="dashboard">

            <div class="dashboard-container">


                <!-- HEADER -->

                <header class="dashboard-header">

                    <div class="dashboard-logo">
                        TWETE
                    </div>


                    <button
                        class="profile-button"
                        type="button"
                    >

                        <svg
                            width="22"
                            height="22"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <circle
                                cx="12"
                                cy="7"
                                r="4"
                            ></circle>

                            <path
                                d="M5.5 21a6.5 6.5 0 0 1 13 0"
                            ></path>

                        </svg>

                    </button>

                </header>


                <!-- WELCOME -->

                <section class="dashboard-welcome">

                    <h1>
                        Welcome!
                    </h1>

                    <p>
                        Your Twete athlete dashboard
                    </p>

                </section>


                <!-- EMPTY DASHBOARD -->

                <section class="empty-dashboard">

                    <p>
                        Your training dashboard will appear here.
                    </p>

                </section>


            </div>

        </main>

    </div>


    <script src="app.js"></script>

</body>

</html>
