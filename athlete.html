<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Home</title>

    <link rel="stylesheet" href="style.css">


    <style>

        /* =========================================
           MESSAGE NOTIFICATION BADGE
        ========================================= */

        .messages-nav-item {
            position: relative;
        }


        .message-notification-badge {

            position: absolute;

            top: -3px;

            right: 40px;

            min-width: 25px;

            height: 25px;

            padding: 0 5px;

            border-radius: 20px;

            background: #ff3b30;

            color: #ffffff;

            display: none;

            align-items: center;

            justify-content: center;

            font-size: 15px;

            font-weight: 800;

            line-height: 1;

            border: 2px solid #050505;

            z-index: 10;

        }


        .message-notification-badge.visible {

            display: flex;

        }


        @media (max-width: 600px) {

            .message-notification-badge {

                right: 10px;

                top: -4px;

            }

        }

    </style>

</head>


<body>

<div class="app athlete-app">


    <!-- Decorative background -->

    <div class="glow-line top"></div>

    <div class="glow-line bottom"></div>



    <main class="athlete-page">


        <!-- =========================
             HEADER
        ========================== -->

        <header class="athlete-header">


            <div class="dashboard-logo">
                TWETE
            </div>


            <span
                id="athleteHeaderName"
                class="athlete-header-name"
            >
            </span>


            <button
                class="profile-button"
                onclick="openProfile()"
                aria-label="Open profile"
                id="athleteProfileButton"
            >

                <div
                    id="athleteProfileAvatar"
                    class="athlete-profile-avatar"
                >

                    <svg
                        width="25"
                        height="25"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="12"
                            cy="7"
                            r="4"
                        ></circle>


                        <path
                            d="M5.5 21a6.5 6.5 0 0 1 13 0"
                        ></path>

                    </svg>

                </div>

            </button>

        </header>



        <!-- =========================
             WELCOME
        ========================== -->

        <section class="athlete-welcome">

            <div
                class="motivation-quote"
                id="motivationQuote"
            >
                Trust the process. Your work will show.
            </div>

        </section>



        <!-- =========================
             CURRENT GOAL
        ========================== -->

        <section class="goal-section">


            <h2 class="section-title">
                Current Goal
            </h2>


            <div
                class="current-goal-card no-goal-card"
                id="currentGoalCard"
            >


                <div class="goal-main">


                    <div class="goal-icon target-icon">


                        <svg
                            width="48"
                            height="48"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.7"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >

                            <circle
                                cx="12"
                                cy="12"
                                r="8"
                            ></circle>


                            <circle
                                cx="12"
                                cy="12"
                                r="4"
                            ></circle>


                            <circle
                                cx="12"
                                cy="12"
                                r="1"
                            ></circle>

                        </svg>

                    </div>



                    <div class="goal-information">


                        <span class="goal-status">
                            CURRENT GOAL
                        </span>


                        <h3 id="currentGoalTitle">
                            No current goal
                        </h3>


                        <p
                            class="goal-pb"
                            id="currentGoalDetails"
                        >
                            Your coach hasn't assigned a goal yet.
                        </p>

                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             PAST GOALS
        ========================== -->

        <section class="goal-section past-goals">


            <h2 class="section-title">
                Past Goals
            </h2>



            <div class="past-goal-card no-goal-card">


                <div class="past-goal-icon">


                    <svg
                        width="34"
                        height="34"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <path d="M8 21h8"></path>

                        <path d="M12 17v4"></path>

                        <path d="M7 4h10"></path>

                        <path d="M8 4v5"></path>

                        <path d="M16 4v5"></path>

                        <path d="M8 9l4 4 4-4"></path>

                    </svg>

                </div>



                <div class="past-goal-information">


                    <span class="goal-status">
                        PAST GOALS
                    </span>


                    <h3>
                        No past goals yet
                    </h3>


                    <p>
                        Completed goals from your coach will appear here.
                    </p>

                </div>

            </div>

        </section>


    </main>



    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav class="bottom-navigation">


        <!-- HOME -->

        <button
            class="nav-item active"
            onclick="goHome()"
        >

            <svg
                width="27"
                height="27"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M3 10.5L12 3l9 7.5"
                ></path>


                <path
                    d="M5 9.5V21h14V9.5"
                ></path>


                <path
                    d="M9 21v-6h6v6"
                ></path>

            </svg>


            <span>
                Home
            </span>

        </button>



        <!-- =========================
             MESSAGES
        ========================== -->

        <button
            class="nav-item messages-nav-item"
            onclick="window.location.href='messages.html'"
            aria-label="Messages"
        >


            <svg
                width="27"
                height="27"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M4 4h16v12H8l-4 4V4z"
                ></path>


                <line
                    x1="8"
                    y1="9"
                    x2="16"
                    y2="9"
                ></line>


                <line
                    x1="8"
                    y1="12"
                    x2="14"
                    y2="12"
                ></line>

            </svg>



            <!-- RED NOTIFICATION -->

            <span
                id="messageNotificationBadge"
                class="message-notification-badge"
            >
                0
            </span>


            <span>
                Messages
            </span>

        </button>


    </nav>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script src="app.js"></script>


<script src="auth-guard.js"></script>


<script>

    protectPage("athlete");


    /* =========================================
       LOAD CURRENT GOAL
    ========================================= */

    async function loadCurrentGoal() {

        const card =
            document.getElementById(
                "currentGoalCard"
            );


        const title =
            document.getElementById(
                "currentGoalTitle"
            );


        const details =
            document.getElementById(
                "currentGoalDetails"
            );


        if (
            !card ||
            !title ||
            !details
        ) {

            return;

        }


        try {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (!user) {

                return;

            }


            const {
                data: goal,
                error
            } =
                await supabaseClient
                    .from("goals")
                    .select(`
                        id,
                        athlete_id,
                        program_id,
                        goal_name,
                        distance,
                        target_time,
                        target_date,
                        created_at
                    `)
                    .eq(
                        "athlete_id",
                        user.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    )
                    .limit(1)
                    .maybeSingle();


            if (error) {

                console.error(
                    "Goal loading error:",
                    error
                );

                return;

            }


            if (!goal) {

                return;

            }


            title.textContent =
                goal.goal_name ||
                "Current Goal";


            const parts = [];


            if (goal.distance) {

                parts.push(
                    goal.distance
                );

            }


            if (goal.target_time) {

                parts.push(
                    goal.target_time
                );

            }


            if (goal.target_date) {

                parts.push(
                    "Target: " +
                    new Date(
                        goal.target_date +
                        "T00:00:00"
                    ).toLocaleDateString(
                        "en-US",
                        {
                            month: "short",
                            day: "numeric",
                            year: "numeric"
                        }
                    )
                );

            }


            details.textContent =
                parts.length
                    ?
                    parts.join(
                        " • "
                    )
                    :
                    "Training goal assigned by your coach.";


            card.classList.remove(
                "no-goal-card"
            );


            card.style.cursor =
                "pointer";


            card.onclick =
                function() {

                    window.location.href =
                        "goal.html?goal_id=" +
                        encodeURIComponent(
                            goal.id
                        );

                };


        } catch (error) {

            console.error(
                "Current goal error:",
                error
            );

        }

    }



    /* =========================================
       MESSAGE NOTIFICATION
    ========================================= */

    async function updateMessageNotification() {

        const badge =
            document.getElementById(
                "messageNotificationBadge"
            );


        if (!badge) {

            return;

        }


        try {

            const {
                data: {
                    user
                }
            } =
                await supabaseClient
                    .auth
                    .getUser();


            if (!user) {

                return;

            }


            const {
                count,
                error
            } =
                await supabaseClient
                    .from("messages")
                    .select(
                        "id",
                        {
                            count: "exact",
                            head: true
                        }
                    )
                    .eq(
                        "receiver_id",
                        user.id
                    )
                    .is(
                        "read_at",
                        null
                    );


            if (error) {

                console.error(
                    "Message notification error:",
                    error
                );

                return;

            }


            if (
                !count ||
                count <= 0
            ) {

                badge.textContent =
                    "0";

                badge.classList.remove(
                    "visible"
                );

                return;

            }


            /*
               Show the exact number up to 99.
               Above 99 we show 99+.
            */

            badge.textContent =
                count > 99
                    ?
                    "99+"
                    :
                    String(count);


            badge.classList.add(
                "visible"
            );


        } catch (error) {

            console.error(
                "Notification error:",
                error
            );

        }

    }



    /* =========================================
       REALTIME MESSAGE NOTIFICATIONS
    ========================================= */

    let athleteMessageNotificationChannel =
        null;


    async function setupMessageNotifications() {

        const {
            data: {
                user
            }
        } =
            await supabaseClient
                .auth
                .getUser();


        if (!user) {

            return;

        }


        /*
           First load existing unread messages.
        */

        await updateMessageNotification();


        /*
           Listen for new messages.
        */

        athleteMessageNotificationChannel =
            supabaseClient
                .channel(
                    "athlete-message-notifications-" +
                    user.id
                )
                .on(
                    "postgres_changes",
                    {
                        event: "INSERT",
                        schema: "public",
                        table: "messages",
                        filter:
                            "receiver_id=eq." +
                            user.id
                    },
                    async function () {

                        await updateMessageNotification();

                    }
                )
                .subscribe();


        /*
           Small fallback check.

           This makes the badge reliable even if
           the browser temporarily loses Realtime.
        */

        setInterval(
            updateMessageNotification,
            10000
        );

    }



    /* =========================================
       START
    ========================================= */

    loadCurrentGoal();


    setupMessageNotifications();

</script>


</body>

</html>
