<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Reset Password</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div class="app login-app">

    <div class="glow-line top"></div>

    <div class="glow-line bottom"></div>


    <main class="login-container">


        <div class="logo">
            TWETE
        </div>


        <section class="welcome">

            <h1>
                Reset your <span>password</span>
            </h1>

            <p>
                Choose a new password for your Twete account.
            </p>

        </section>


        <section class="login-card">


            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label for="newPassword">
                    New password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                    >

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirmPassword">
                    Confirm password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                    >

                </div>

            </div>


            <!-- RESET BUTTON -->

            <button
                type="button"
                class="login-button"
                id="resetButton"
                onclick="resetPassword()"
            >
                Set new password
            </button>


            <!-- MESSAGE -->

            <div
                id="resetMessage"
                style="
                    margin-top: 15px;
                    text-align: center;
                    font-size: 14px;
                    min-height: 20px;
                "
            ></div>


        </section>

    </main>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://uhbhsyuodizauwhhdffu.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_o-hfeydDJf5J-xPQyxwVow_DJ3StSNn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const newPassword =
    document.getElementById(
        "newPassword"
    );


const confirmPassword =
    document.getElementById(
        "confirmPassword"
    );


const resetButton =
    document.getElementById(
        "resetButton"
    );


const resetMessage =
    document.getElementById(
        "resetMessage"
    );


function showResetMessage(
    message,
    success = false
) {

    resetMessage.textContent =
        message;

    resetMessage.style.color =
        success
            ? "#C6FF00"
            : "#ff6b6b";
}


async function resetPassword() {

    const password =
        newPassword.value;

    const confirmation =
        confirmPassword.value;


    if (!password) {

        showResetMessage(
            "Please enter a new password."
        );

        return;
    }


    if (password.length < 6) {

        showResetMessage(
            "Password must be at least 6 characters."
        );

        return;
    }


    if (password !== confirmation) {

        showResetMessage(
            "The passwords do not match."
        );

        return;
    }


    resetButton.disabled =
        true;

    resetButton.textContent =
        "Updating password...";


    try {

        const {
            error
        } =
            await supabaseClient.auth
                .updateUser({

                    password:
                        password

                });


        if (error) {

            console.error(
                "Password update error:",
                error
            );

            showResetMessage(
                error.message ||
                "Unable to update password."
            );

            return;
        }


        showResetMessage(
            "Password updated successfully! You can now log in.",
            true
        );


        newPassword.value = "";

        confirmPassword.value = "";


        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            2000
        );


    } catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        showResetMessage(
            "Something went wrong. Please try again."
        );


    } finally {

        resetButton.disabled =
            false;

        resetButton.textContent =
            "Set new password";
    }
}

</script>

</body>

</html>
