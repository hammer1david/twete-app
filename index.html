<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Twete | Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app login-app">

        <div class="glow-line top"></div>
        <div class="glow-line bottom"></div>

        <main class="login-container">

            <div class="logo">
                TWETE
            </div>

            <section class="welcome">

                <h1>
                    Welcome to <span>Twete!</span>
                </h1>

                <p>
                    Train smarter. Run stronger.
                </p>

            </section>

            <section class="login-card">

                <!-- Username -->

                <div class="input-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <circle cx="12" cy="7" r="4"></circle>
                            <path d="M5.5 21a6.5 6.5 0 0 1 13 0"></path>
                        </svg>

                        <input
                            type="text"
                            id="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <rect
                                x="4"
                                y="10"
                                width="16"
                                height="11"
                                rx="2"
                            ></rect>

                            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>

                            <path d="M12 14v3"></path>

                        </svg>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            onclick="togglePassword()"
                        >

                            <svg
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                width="23"
                                height="23"
                            >
                                <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Login -->

                <button
                    type="button"
                    class="login-button"
                    onclick="login()"
                >
                    Log in
                </button>


                <!-- Forgot password -->

                <button
                    type="button"
                    class="forgot-password"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </button>

            </section>

        </main>

    </div>

    <script src="app.js"></script>

</body>
</html>
