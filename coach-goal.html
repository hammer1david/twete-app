<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Twete Coach | Goal</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.page {
    width: 100%;
    max-width: 1000px;
    margin: auto;
    padding: 25px 20px 70px;
}


/* ===============================
   TOP BAR
================================ */

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 30px;
    gap: 15px;
}

.logo {
    color: #C6FF00;
    font-size: 25px;
    font-weight: 900;
    letter-spacing: 2px;
}

.coach-label {
    color: #777;
    font-size: 10px;
    letter-spacing: 3px;
    margin-top: 3px;
}

.topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.back-button,
.update-athlete-button {
    background: #111;
    color: white;
    padding: 10px 15px;
    border-radius: 8px;
}

.back-button {
    border: 1px solid #333;
}

.back-button:hover {
    border-color: #C6FF00;
}

.update-athlete-button {
    border: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 7px;
}

.update-athlete-button:hover {
    border-color: #C6FF00;
}

.update-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ff8a00;
    flex-shrink: 0;
}

.update-status-dot.green {
    background: #45d483;
}


/* ===============================
   GOAL
================================ */

.goal-header {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 15px;
    overflow: hidden;
    margin-bottom: 30px;
}

.goal-top {
    padding: 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.goal-title-area {
    display: flex;
    align-items: center;
    gap: 15px;
    min-width: 0;
}

.goal-icon {
    width: 48px;
    height: 48px;
    flex-shrink: 0;
    border-radius: 10px;
    background: #182000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #C6FF00;
    font-size: 25px;
}

.goal-name {
    font-size: 27px;
    font-weight: 800;
    overflow-wrap: anywhere;
}

.goal-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.edit-goal-button,
.delete-goal-button {
    background: #111;
    padding: 10px 14px;
    border-radius: 7px;
}

.edit-goal-button {
    border: 1px solid #333;
    color: white;
}

.edit-goal-button:hover {
    border-color: #C6FF00;
}

.delete-goal-button {
    border: 1px solid #702222;
    color: #ff5555;
}

.goal-info {
    border-top: 1px solid #292929;
    padding: 20px 24px;
}

.goal-details {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.detail-label {
    color: #777;
    font-size: 12px;
    margin-bottom: 6px;
}

.detail-value {
    font-size: 17px;
    font-weight: 700;
    overflow-wrap: anywhere;
}

.progress-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-top: 20px;
}

.progress-bar {
    flex: 1;
    height: 8px;
    background: #292929;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    background: #C6FF00;
}

.progress-number {
    min-width: 42px;
    color: #C6FF00;
    font-size: 13px;
    font-weight: 700;
    text-align: right;
}


/* ===============================
   WEEKS
================================ */

.weeks-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.weeks-heading h2 {
    margin: 0;
    font-size: 20px;
}

.add-week-button {
    border: none;
    background: #C6FF00;
    color: #050505;
    padding: 11px 17px;
    border-radius: 8px;
    font-weight: 800;
}

.weeks-list {
    display: grid;
    gap: 10px;
}

.week-card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 10px;
    overflow: hidden;

    transition:
        opacity 0.3s ease,
        filter 0.3s ease,
        border-color 0.3s ease;
}

.week-card.past-week {
    opacity: 0.42;
    filter: grayscale(0.7);
}

.week-card.current-week {
    border-color: #C6FF00;
    box-shadow:
        0 0 0 1px
        rgba(198,255,0,0.08);
}

.week-header {
    min-height: 58px;
    padding: 10px 14px;

    display: flex;
    align-items: center;
    gap: 10px;

    cursor: pointer;
}

.week-header:hover {
    background: #141414;
}

.week-arrow {
    width: 20px;
    color: #C6FF00;
    font-size: 19px;
    text-align: center;
    transition: transform 0.15s;
}

.week-card.open .week-arrow {
    transform: rotate(90deg);
}

.week-title {
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
}

.week-dates {
    color: #777;
    font-size: 11px;
    flex: 1;
    min-width: 0;
}

.week-label {
    display: inline-block;
    margin-left: 8px;
    padding: 3px 7px;

    border: 1px solid #333;
    border-radius: 5px;

    color: #C6FF00;
    font-size: 9px;
    font-weight: 700;

    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.week-km {
    color: #C6FF00;
    font-size: 11px;
    white-space: nowrap;
}

.week-actions {
    display: flex;
    gap: 7px;
}

.add-session-button,
.edit-week-button,
.delete-week-button {
    background: #111;
    padding: 7px 10px;
    border-radius: 7px;
    font-size: 11px;
}

.add-session-button,
.edit-week-button {
    border: 1px solid #333;
    color: white;
}

.add-session-button:hover,
.edit-week-button:hover {
    border-color: #C6FF00;
}

.delete-week-button {
    border: 1px solid #702222;
    color: #ff5555;
}


/* ===============================
   SESSIONS
================================ */

.sessions {
    display: none;
    padding: 0 10px 10px;
}

.week-card.open .sessions {
    display: grid;
    gap: 6px;
}

.session-card {
    width: 100%;
    min-width: 0;

    background: #151515;
    border: 1px solid #252525;
    border-radius: 8px;

    padding: 12px;

    display: grid;
    grid-template-columns:
        85px
        minmax(0, 1fr)
        auto;

    align-items: start;
    gap: 15px;
}

.session-date {
    border-right: 1px solid #292929;
    padding-right: 12px;
}

.session-day {
    color: #777;
    font-size: 11px;
}

.session-date-number {
    font-size: 14px;
    font-weight: 700;
    margin-top: 3px;
}

.session-content {
    min-width: 0;
}

.session-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 5px;
    overflow-wrap: anywhere;
}

.session-details {
    color: #888;
    font-size: 11px;
    min-width: 0;
    overflow-wrap: anywhere;
    word-break: break-word;
}

.session-notes {
    margin-top: 8px;
    width: 100%;
    min-width: 0;
}

.session-notes-label {
    color: #999;
    font-size: 11px;
    margin-bottom: 4px;
}

.session-notes-box {
    width: 100%;
    max-width: 100%;
    min-width: 0;

    padding: 7px 9px;

    background: #0b0b0b;
    border: 1px solid #292929;
    border-radius: 7px;

    color: #bdbdbd;
    font-size: 12px;
    line-height: 1.45;

    text-align: left;
    vertical-align: top;

    overflow-wrap: anywhere;
    word-break: break-word;
    white-space: pre-wrap;
}

.session-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
}

.edit-session-button,
.delete-session-button {
    background: #111;
    padding: 7px 9px;
    border-radius: 7px;
    font-size: 11px;
}

.edit-session-button {
    border: 1px solid #333;
    color: white;
}

.edit-session-button:hover {
    border-color: #C6FF00;
}

.delete-session-button {
    border: 1px solid #5b2525;
    color: #ff5555;
}

.no-sessions {
    padding: 18px;
    text-align: center;
    color: #666;
    font-size: 12px;
}


/* ===============================
   MODAL
================================ */

.modal-overlay {
    position: fixed;
    inset: 0;

    background: rgba(0,0,0,0.78);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 100;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: 100%;
    max-width: 620px;
    max-height: 90vh;
    overflow-y: auto;

    background: #111;
    border: 1px solid #333;

    border-radius: 14px;

    padding: 24px;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.modal-header h2 {
    margin: 0;
    font-size: 20px;
}

.close-button {
    border: none;
    background: none;
    color: #888;
    font-size: 24px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.form-group {
    margin-bottom: 14px;
    min-width: 0;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    display: block;
    color: #999;
    font-size: 11px;
    margin-bottom: 6px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    max-width: 100%;

    background: #080808;
    color: white;

    border: 1px solid #333;
    border-radius: 7px;

    padding: 11px;

    outline: none;
}

.form-group textarea {
    min-height: 150px;
    resize: vertical;

    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
    border-color: #C6FF00;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 8px;
}

.cancel-button {
    background: #181818;
    border: 1px solid #333;
    color: white;
    padding: 10px 15px;
    border-radius: 7px;
}

.save-button {
    background: #C6FF00;
    border: none;
    color: #050505;
    padding: 10px 17px;
    border-radius: 7px;
    font-weight: 800;
}


/* ===============================
   STATES
================================ */

.loading {
    color: #888;
    padding: 25px;
}

.empty {
    border: 1px dashed #333;
    border-radius: 10px;
    padding: 30px;
    text-align: center;
    color: #777;
}

.error {
    color: #ff6666;
}


/* ===============================
   MOBILE
================================ */

@media (max-width: 700px) {

    .page {
        padding: 18px 12px 60px;
    }

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .topbar-actions {
        width: 100%;
    }

    .topbar-actions button {
        flex: 1;
    }

    .goal-top {
        align-items: flex-start;
        flex-direction: column;
    }

    .goal-actions {
        width: 100%;
    }

    .goal-actions button {
        flex: 1;
    }

    .goal-details {
        grid-template-columns: repeat(2, 1fr);
    }

    .week-header {
        flex-wrap: wrap;
    }

    .week-dates {
        width: 100%;
        flex: auto;
        padding-left: 30px;
    }

    .week-km {
        width: 100%;
        padding-left: 30px;
    }

    .week-actions {
        width: 100%;
        padding-left: 30px;
    }

    .week-actions button {
        flex: 1;
    }

    .session-card {
        grid-template-columns:
            65px
            minmax(0, 1fr);
    }

    .session-actions {
        grid-column: 2;
        justify-self: start;
    }

}

@media (max-width: 450px) {

    .topbar {
        align-items: flex-start;
        gap: 10px;
    }

    .back-button,
    .update-athlete-button {
        font-size: 11px;
        padding: 8px 10px;
    }

    .goal-name {
        font-size: 22px;
    }

    .goal-details {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .form-group.full {
        grid-column: auto;
    }

    .modal {
        padding: 18px;
    }

}

</style>

</head>


<body>


<div class="page">


    <div class="topbar">

        <div>

            <div class="logo">
                TWETE
            </div>

            <div class="coach-label">
                COACH
            </div>

        </div>


        <div class="topbar-actions">

            <button
                class="update-athlete-button"
                onclick="updateAthlete()"
            >

                <span
                    id="updateStatusDot"
                    class="update-status-dot"
                ></span>

                Update Athlete

            </button>


            <button
                class="back-button"
                onclick="goBack()"
            >
                ← Back to Athlete
            </button>

        </div>

    </div>


    <section
        class="goal-header"
        id="goalHeader"
    >

        <div class="loading">
            Loading goal...
        </div>

    </section>


    <div class="weeks-heading">

        <h2>
            Training Weeks
        </h2>

        <button
            class="add-week-button"
            onclick="addWeek()"
        >
            + Add Week
        </button>

    </div>


    <div
        class="weeks-list"
        id="weeksList"
    >

        <div class="loading">
            Loading weeks...
        </div>

    </div>


</div>


<!-- ===============================
     SESSION MODAL
================================ -->

<div
    class="modal-overlay"
    id="sessionModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="sessionModalTitle">
                New Session
            </h2>

            <button
                class="close-button"
                onclick="closeSessionModal()"
            >
                ×
            </button>

        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Date *
                </label>

                <input
                    type="date"
                    id="sessionDate"
                >

            </div>


            <div class="form-group">

                <label>
                    Session title *
                </label>

                <input
                    type="text"
                    id="sessionTitle"
                    placeholder="e.g. Easy Run"
                >

            </div>


            <div class="form-group">

                <label>
                    Workout type
                </label>

                <select id="sessionType">

                    <option value="Easy Run">
                        Easy Run
                    </option>

                    <option value="Long Run">
                        Long Run
                    </option>

                    <option value="Intervals">
                        Intervals
                    </option>

                    <option value="Tempo">
                        Tempo
                    </option>

                    <option value="Threshold">
                        Threshold
                    </option>

                    <option value="Recovery">
                        Recovery
                    </option>

                    <option value="Race">
                        Race
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Distance (km)
                </label>

                <input
                    type="number"
                    step="0.1"
                    id="sessionDistance"
                    placeholder="10"
                >

            </div>


            <div class="form-group">

                <label>
                    Duration (minutes)
                </label>

                <input
                    type="number"
                    id="sessionDuration"
                    placeholder="45"
                >

            </div>


            <div class="form-group">

                <label>
                    Pace
                </label>

                <input
                    type="text"
                    id="sessionPace"
                    placeholder="4:30"
                >

            </div>


            <div class="form-group full">

                <label>
                    Notes
                </label>

                <textarea
                    id="sessionNotes"
                    placeholder="Describe the workout..."
                ></textarea>

            </div>


        </div>


        <div class="modal-footer">

            <button
                class="cancel-button"
                onclick="closeSessionModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveSession()"
            >
                Save Session
            </button>

        </div>

    </div>

</div>


<!-- ===============================
     WEEK MODAL
================================ -->

<div
    class="modal-overlay"
    id="weekModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2 id="weekModalTitle">
                New Week
            </h2>

            <button
                class="close-button"
                onclick="closeWeekModal()"
            >
                ×
            </button>

        </div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Start date *
                </label>

                <input
                    type="date"
                    id="weekStartDate"
                >

            </div>


            <div class="form-group">

                <label>
                    End date *
                </label>

                <input
                    type="date"
                    id="weekEndDate"
                >

            </div>


            <div class="form-group">

                <label>
                    Week label
                </label>

                <input
                    type="text"
                    id="weekLabel"
                    placeholder="Loading / Sharpening / Race Week"
                >

            </div>


            <div class="form-group">

                <label>
                    Weekly kilometres
                </label>

                <input
                    type="number"
                    step="0.1"
                    min="0"
                    id="weekKm"
                    placeholder="e.g. 80"
                >

            </div>


        </div>


        <div class="modal-footer">

            <button
                class="cancel-button"
                onclick="closeWeekModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveWeek()"
            >
                Save Week
            </button>

        </div>

    </div>

</div>


<!-- ===============================
     GOAL MODAL
================================ -->

<div
    class="modal-overlay"
    id="goalModal"
>

    <div class="modal">

        <div class="modal-header">

            <h2>
                Edit Goal
            </h2>

            <button
                class="close-button"
                onclick="closeGoalModal()"
            >
                ×
            </button>

        </div>


        <div class="form-grid">


            <div class="form-group full">

                <label>
                    Goal name
                </label>

                <input
                    type="text"
                    id="goalNameInput"
                >

            </div>


            <div class="form-group">

                <label>
                    Distance
                </label>

                <input
                    type="text"
                    id="goalDistanceInput"
                >

            </div>


            <div class="form-group">

                <label>
                    Goal time
                </label>

                <input
                    type="text"
                    id="goalTimeInput"
                >

            </div>


            <div class="form-group full">

                <label>
                    Goal date
                </label>

                <input
                    type="date"
                    id="goalDateInput"
                >

            </div>


        </div>


        <div class="modal-footer">

            <button
                class="cancel-button"
                onclick="closeGoalModal()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveGoal()"
            >
                Save Goal
            </button>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="coach-goal.js"></script>

</body>

    </html>
