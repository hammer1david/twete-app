<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Twete | Goal</title>

    <link
        rel="stylesheet"
        href="goal.css"
    >

</head>


<body>


<div class="goal-app">


    <!-- HEADER -->

    <header class="goal-header">

        <button
            class="back-button"
            onclick="goHome()"
            aria-label="Back"
        >

            <svg viewBox="0 0 24 24">

                <path
                    d="M15 18l-6-6 6-6"
                ></path>

            </svg>

        </button>


        <h1>
            Goal
        </h1>


        <button
            class="more-button"
            aria-label="More"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>

    </header>



    <main class="goal-content">


        <!-- CURRENT GOAL -->

        <section class="goal-card">


            <div class="goal-card-top">


                <div class="target-icon">

                    <svg
                        viewBox="0 0 64 64"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >

                        <circle
                            cx="32"
                            cy="32"
                            r="23"
                        ></circle>

                        <circle
                            cx="32"
                            cy="32"
                            r="12"
                        ></circle>

                        <circle
                            cx="32"
                            cy="32"
                            r="3"
                        ></circle>

                        <path
                            d="M37 27 L52 12"
                        ></path>

                        <path
                            d="M43 12 H52 V21"
                        ></path>

                    </svg>

                </div>



                <div class="goal-main-info">

                    <span class="goal-label">
                        CURRENT GOAL
                    </span>


                    <h2>
                        Loading...
                    </h2>


                    <div class="goal-date">

                        <svg viewBox="0 0 24 24">

                            <rect
                                x="3"
                                y="4"
                                width="18"
                                height="17"
                                rx="2"
                            ></rect>

                            <line
                                x1="8"
                                y1="2"
                                x2="8"
                                y2="6"
                            ></line>

                            <line
                                x1="16"
                                y1="2"
                                x2="16"
                                y2="6"
                            ></line>

                            <line
                                x1="3"
                                y1="10"
                                x2="21"
                                y2="10"
                            ></line>

                        </svg>

                        Target date:
                        Loading...

                    </div>


                    <p>
                        Training goal assigned by your coach.
                    </p>

                </div>



                <div class="goal-progress">

                    <svg
                        class="progress-circle"
                        viewBox="0 0 120 120"
                    >

                        <circle
                            class="progress-background"
                            cx="60"
                            cy="60"
                            r="50"
                        ></circle>


                        <circle
                            class="progress-circle-value"
                            cx="60"
                            cy="60"
                            r="50"
                        ></circle>

                    </svg>


                    <div class="progress-number">

                        <strong>
                            0%
                        </strong>

                    </div>


                    <span>
                        Progress
                    </span>

                </div>


            </div>



            <div class="goal-divider"></div>



            <div class="goal-motivation">

                <svg viewBox="0 0 24 24">

                    <path
                        d="M12 3l2.7 5.5L21 9.4l-4.5 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L3 9.4l6.3-.9z"
                    ></path>

                </svg>


                Stay consistent. Trust the process. Get faster.

            </div>


        </section>



        <!-- TRAINING PLAN -->

        <section class="training-section">


            <h2 class="section-heading">
                Training Plan
            </h2>



            <div class="week-selector">

                <div class="athlete-empty">
                    Loading training weeks...
                </div>

            </div>



            <div class="week-indicator">

                <div
                    class="week-indicator-fill"
                ></div>

            </div>



            <div id="weekOverview"></div>

<div id="workoutList">

    <div class="athlete-empty">
        Loading sessions...
    </div>

</div>


        </section>


    </main>



    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-navigation">


        <button
            class="nav-item active"
            onclick="goHome()"
        >

            <svg
                width="27"
                height="27"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M3 10.5L12 3l9 7.5"
                ></path>

                <path
                    d="M5 9.5V21h14V9.5"
                ></path>

                <path
                    d="M9 21v-6h6v6"
                ></path>

            </svg>


            <span>
                Home
            </span>

        </button>



        <button
            class="nav-item"
            onclick="openMessages()"
        >

            <svg
                width="27"
                height="27"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
            >

                <path
                    d="M4 4h16v12H8l-4 4V4z"
                ></path>

                <line
                    x1="8"
                    y1="9"
                    x2="16"
                    y2="9"
                ></line>

                <line
                    x1="8"
                    y1="12"
                    x2="14"
                    y2="12"
                ></line>

            </svg>


            <span>
                Messages
            </span>

        </button>


    </nav>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="goal.js"></script>


</body>

</html>
